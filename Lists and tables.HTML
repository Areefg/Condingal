<html>
    
<Head>

    <title>
     Lists and Tables.
    </title>

</Head>

<Body> 

<ol>
    <li>potatoes</li>
    <li>carrots</li>
    <li>peas</li>
    <li>apples</li>
    <li>peppers</li>

</ol>

<ul>
    <li>Lamborghini</li>
    <li>Ferrari</li>
    <li>Porsche</li>
    <li>Bugatti</li>
    <li>koenigsegg</li>
    
</ul>

</Body>

<head>

    <title>
        Table
    </title>

</head>

<body>

<table border="2px" bgcolor="red">
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Country</th>
    </tr>
    <tr>
        <td>Areef</td>
        <td>15</td>
        <td>Nigeria</td>
    </tr>
</table>

</body>


</html>
